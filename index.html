<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jábega · Análisis de Regatas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --sea:#1a6b8a; --sea-mid:#2389ab; --sea-light:#4baec8; --sea-pale:#e6f4f8;
  --gold:#c89a2e; --gold-light:#e8b84b;
  --green:#1d8a5e; --amber:#b07010; --coral:#993C1D; --purple:#7b52a8;
  --bg:#f0f7fa; --bg2:#e4f0f5; --white:#ffffff;
  --text:#1a2e3a; --text2:#4a6270; --text3:#8aabb8;
  --border:rgba(26,107,138,0.13); --radius:14px;
  --shadow:0 2px 16px rgba(26,107,138,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';display:block;height:5px;background:linear-gradient(90deg,var(--sea),var(--sea-light),var(--gold-light))}
.app{max-width:1080px;margin:0 auto;padding:0 20px 60px}

/* HEADER WITH LOGO INTEGRATION */
header{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}

/* Contenedor del Logo y los Títulos */
.header-brand-container {
  display: flex;
  align-items: center;
  gap: 18px;
}
.header-logo {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(26, 107, 138, 0.15);
  flex-shrink: 0;
}

.club-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sea-mid);text-transform:uppercase;margin-bottom:6px}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,4vw,36px);color:var(--text);line-height:1.1;letter-spacing:-.02em}
h1 span{color:var(--sea)}
.header-meta{font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.header-meta b{color:var(--text);font-weight:500}
.badge{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:white;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;padding:7px 18px;border-radius:100px;letter-spacing:.04em;box-shadow:0 4px 14px rgba(200,154,46,0.35);white-space:nowrap;align-self:flex-start}

/* RACE SELECTOR */
.race-selector{display:flex;gap:8px;flex-wrap:wrap}
.race-btn{padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
.race-btn:hover{border-color:var(--sea);color:var(--sea)}
.race-btn.active{background:var(--sea);color:white;border-color:var(--sea);box-shadow:0 2px 10px rgba(26,107,138,0.25)}
.race-btn .race-btn-date{font-size:10px;font-family:'DM Mono',monospace;opacity:.7;display:block;margin-top:1px}

/* NAV TABS */
.nav-tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:22px;width:fit-content;flex-wrap:wrap}
.tab-btn{padding:7px 16px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
.tab-btn:hover{color:var(--sea)}
.tab-btn.active{background:var(--white);color:var(--sea);box-shadow:0 1px 6px rgba(26,107,138,0.12)}

/* PANELS */
.panel{display:none;animation:fadeUp .25s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);padding:22px;border:1px solid var(--border);box-shadow:var(--shadow)}
.sec-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.mb16{margin-bottom:16px}
.mt16{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:var(--sea-pale);border:1px solid rgba(26,107,138,0.1);border-radius:10px;padding:14px 16px}
.stat-card.accent{background:var(--sea)}
.stat-card.accent .stat-lbl,.stat-card.accent .stat-unit{color:rgba(255,255,255,0.65)}
.stat-card.accent .stat-val{color:white}
.stat-card.gold-c{background:linear-gradient(135deg,#7a5a10,#b88a28)}
.stat-card.gold-c .stat-lbl,.stat-card.gold-c .stat-unit,.stat-card.gold-c .stat-val{color:white}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:3px}
.stat-val{font-family:'Syne',sans-serif;font-weight:700;font-size:24px;color:var(--sea);line-height:1}
.stat-unit{font-size:11px;color:var(--text3);margin-top:2px}

/* PHASE BAR */
.phase-bar{display:flex;height:42px;border-radius:9px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,0.07)}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:600;color:rgba(255,255,255,0.95);cursor:default;gap:1px}
.ph-sub{font-size:9px;opacity:.7;font-weight:400}
.ph-ida{background:#185FA5}.ph-dev{background:#1D9E75}.ph-ciab{background:#7b52a8}.ph-reac{background:#0f7a8a}.ph-sprint{background:#993C1D}
.phase-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text2)}
.phase-legend span{display:flex;align-items:center;gap:5px}
.pl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* CHART */
.chart-area{background:var(--sea-pale);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}

/* CIABOGA */
.ciab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.ciab-metric{background:linear-gradient(135deg,#f3eeff,#ece4ff);border:1px solid rgba(123,82,168,0.2);border-radius:10px;padding:14px 16px}
.ciab-metric .stat-lbl{color:#7b52a8}.ciab-metric .stat-val{color:#5a3a88;font-size:20px}.ciab-metric .stat-unit{color:rgba(91,58,136,0.6)}
.ciab-step{display:flex;gap:14px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.ciab-step:last-child{border-bottom:none}
.ciab-time{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:#7b52a8;width:40px;flex-shrink:0;padding-top:2px}
.ci
