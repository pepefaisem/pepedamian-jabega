<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jábega · Análisis de Regatas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --sea:#1a6b8a; --sea-mid:#2389ab; --sea-light:#4baec8; --sea-pale:#e6f4f8;
  --gold:#c89a2e; --gold-light:#e8b84b;
  --green:#1d8a5e; --amber:#b07010; --coral:#993C1D; --purple:#7b52a8;
  --bg:#f0f7fa; --bg2:#e4f0f5; --white:#ffffff;
  --text:#1a2e3a; --text2:#4a6270; --text3:#8aabb8;
  --border:rgba(26,107,138,0.13); --radius:14px;
  --shadow:0 2px 16px rgba(26,107,138,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';display:block;height:5px;background:linear-gradient(90deg,var(--sea),var(--sea-light),var(--gold-light))}
.app{max-width:1080px;margin:0 auto;padding:0 20px 60px}

/* HEADER */
header{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.club-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sea-mid);text-transform:uppercase;margin-bottom:6px}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,4vw,36px);color:var(--text);line-height:1.1;letter-spacing:-.02em}
h1 span{color:var(--sea)}
.header-meta{font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.header-meta b{color:var(--text);font-weight:500}
.badge{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:white;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;padding:7px 18px;border-radius:100px;letter-spacing:.04em;box-shadow:0 4px 14px rgba(200,154,46,0.35);white-space:nowrap;align-self:flex-start}

/* RACE SELECTOR */
.race-selector{display:flex;gap:8px;flex-wrap:wrap}
.race-btn{padding:8px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
.race-btn:hover{border-color:var(--sea);color:var(--sea)}
.race-btn.active{background:var(--sea);color:white;border-color:var(--sea);box-shadow:0 2px 10px rgba(26,107,138,0.25)}
.race-btn .race-btn-date{font-size:10px;font-family:'DM Mono',monospace;opacity:.7;display:block;margin-top:1px}

/* NAV TABS */
.nav-tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:22px;width:fit-content;flex-wrap:wrap}
.tab-btn{padding:7px 16px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
.tab-btn:hover{color:var(--sea)}
.tab-btn.active{background:var(--white);color:var(--sea);box-shadow:0 1px 6px rgba(26,107,138,0.12)}

/* PANELS */
.panel{display:none;animation:fadeUp .25s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);padding:22px;border:1px solid var(--border);box-shadow:var(--shadow)}
.sec-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.mb16{margin-bottom:16px}
.mt16{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:var(--sea-pale);border:1px solid rgba(26,107,138,0.1);border-radius:10px;padding:14px 16px}
.stat-card.accent{background:var(--sea)}
.stat-card.accent .stat-lbl,.stat-card.accent .stat-unit{color:rgba(255,255,255,0.65)}
.stat-card.accent .stat-val{color:white}
.stat-card.gold-c{background:linear-gradient(135deg,#7a5a10,#b88a28)}
.stat-card.gold-c .stat-lbl,.stat-card.gold-c .stat-unit,.stat-card.gold-c .stat-val{color:white}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:3px}
.stat-val{font-family:'Syne',sans-serif;font-weight:700;font-size:24px;color:var(--sea);line-height:1}
.stat-unit{font-size:11px;color:var(--text3);margin-top:2px}

/* PHASE BAR */
.phase-bar{display:flex;height:42px;border-radius:9px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,0.07)}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:600;color:rgba(255,255,255,0.95);cursor:default;gap:1px}
.ph-sub{font-size:9px;opacity:.7;font-weight:400}
.ph-ida{background:#185FA5}.ph-dev{background:#1D9E75}.ph-ciab{background:#7b52a8}.ph-reac{background:#0f7a8a}.ph-sprint{background:#993C1D}
.phase-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text2)}
.phase-legend span{display:flex;align-items:center;gap:5px}
.pl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* CHART */
.chart-area{background:var(--sea-pale);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}

/* CIABOGA */
.ciab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.ciab-metric{background:linear-gradient(135deg,#f3eeff,#ece4ff);border:1px solid rgba(123,82,168,0.2);border-radius:10px;padding:14px 16px}
.ciab-metric .stat-lbl{color:#7b52a8}.ciab-metric .stat-val{color:#5a3a88;font-size:20px}.ciab-metric .stat-unit{color:rgba(91,58,136,0.6)}
.ciab-step{display:flex;gap:14px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.ciab-step:last-child{border-bottom:none}
.ciab-time{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:#7b52a8;width:40px;flex-shrink:0;padding-top:2px}
.ciab-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ciab-text{font-size:12.5px;color:var(--text2);line-height:1.55}
.ciab-text b{color:var(--text);font-weight:500}

/* ROWERS */
.rower-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.rower-card{background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.rower-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(26,107,138,0.14)}
.rower-header{padding:13px 16px 11px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.rower-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:white;flex-shrink:0}
.av-babor{background:linear-gradient(135deg,#185FA5,#378ADD)}
.av-estribor{background:linear-gradient(135deg,#1D8A5E,#3BB87A)}
.av-patron{background:linear-gradient(135deg,#9a6a10,#d4a030)}
.rower-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px}
.rower-sub{font-size:11px;color:var(--text3);margin-top:1px}
.band-badge{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.06em;padding:3px 8px;border-radius:20px;font-weight:500}
.bb-babor{background:#E6F1FB;color:#185FA5}
.bb-estribor{background:#E1F5EE;color:#0F6E56}
.bb-patron{background:#FAEEDA;color:#854F0B}
.rower-body{padding:13px 16px 16px}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.score-label{font-size:11.5px;color:var(--text2);width:88px;flex-shrink:0}
.score-bg{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.fg{background:linear-gradient(90deg,#1D8A5E,#5DCAA5)}
.fa{background:linear-gradient(90deg,#BA7517,#EF9F27)}
.fr{background:linear-gradient(90deg,#993C1D,#D85A30)}
.fb{background:linear-gradient(90deg,#185FA5,#378ADD)}
.fp{background:linear-gradient(90deg,#6b3a9a,#a06ed4)}
.score-pct{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);width:28px;text-align:right}
.phase-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.chip-g{background:#E1F5EE;color:#0F6E56}
.chip-a{background:#FAEEDA;color:#854F0B}
.chip-r{background:#FAECE7;color:#993C1D}
.chip-p{background:#f0eaff;color:#6b3a9a}
.note-box{margin-top:11px;padding:9px 11px;background:var(--sea-pale);border-radius:8px;border-left:3px solid var(--sea)}
.note-ttl{font-size:10px;font-weight:500;color:var(--sea);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.note-txt{font-size:12px;color:var(--text2);line-height:1.6}
.priority-box{margin-top:7px;padding:9px 11px;background:#f3eeff;border-radius:8px;border-left:3px solid #7b52a8}
.priority-box .note-ttl{color:#7b52a8}

/* EVOL badge on rower card */
.evol-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;font-family:'DM Mono',monospace;margin-top:6px}
.evol-up{background:#e1f5ee;color:#0f6e56}
.evol-down{background:#faece7;color:#993c1d}
.evol-same{background:var(--sea-pale);color:var(--sea)}
.evol-new{background:#faeeda;color:#854f0b}

/* MEJORAS */
.mej-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:18px}
.mej-card{background:var(--white);border-radius:var(--radius);padding:17px 19px;border:1px solid var(--border);border-left:4px solid;box-shadow:var(--shadow)}
.mej-card.pos{border-left-color:#1D8A5E}
.mej-card.neg{border-left-color:#D85A30}
.mej-card.tip{border-left-color:#185FA5}
.mej-card.cib{border-left-color:#7b52a8}
.mej-icon{font-size:19px;margin-bottom:7px}
.mej-ttl{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:6px}
.mej-txt{font-size:12.5px;color:var(--text2);line-height:1.65}

/* HISTÓRICO */
.hist-card{background:var(--white);border-radius:var(--radius);padding:22px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px}
.week-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);border-radius:8px;transition:background .15s}
.week-row:last-child{border-bottom:none}
.week-row:hover{background:var(--sea-pale)}
.week-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);width:50px}
.week-date{font-size:13px;font-weight:500;color:var(--text);flex:1}
.week-pos{font-family:'Syne',sans-serif;font-weight:700;font-size:14px}
.pos-1{color:#c89a2e}.pos-2{color:#888}.pos-3{color:#a06030}.pos-other{color:var(--sea)}
.week-cadencia{font-family:'DM Mono',monospace;font-size:11px;background:var(--sea-pale);padding:3px 9px;border-radius:20px;color:var(--sea)}
.week-trend{font-size:13px}
.msel{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.msel:hover{border-color:var(--sea);color:var(--sea)}
.msel.active{background:var(--sea);color:white;border-color:var(--sea)}
.hito-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.hito-row:last-child{border-bottom:none}
.hito-icon{font-size:15px;flex-shrink:0}
.hito-label{flex:1;color:var(--text2)}
.hito-vals{font-family:'DM Mono',monospace;font-size:12px;display:flex;gap:8px;align-items:center}
.hito-ok{color:#1d8a5e;font-weight:500}
.hito-nog{color:#b07010;font-weight:500}
.hito-badge{font-size:10px;padding:2px 7px;border-radius:10px}
.badge-ok{background:#e1f5ee;color:#0f6e56}
.badge-prog{background:#faeeda;color:#854f0b}

@media(max-width:560px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .ph .ph-sub{display:none}
  .ph{font-size:10px}
  .nav-tabs{width:100%}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="header-top">
    <div>
      <div class="club-lbl">⚡ Jábega La Araña · Málaga · Veterano Masculino</div>
      <h1>Análisis de <span>Regatas</span><br>Temporada 2026</h1>
      <div class="header-meta">
        <span>Equipo: <b>La Araña</b></span>
        <span>Regatas: <b id="hdr-total">2</b></span>
        <span>Mejor dif. con 1.º: <b>+1.39 s</b></span>
      </div>
    </div>
    <div class="badge" id="hdr-badge">🥉 3.º · Huelin</div>
  </div>

  <!-- Race selector -->
  <div class="race-selector" id="race-selector"></div>
</header>

<nav class="nav-tabs">
  <button class="tab-btn active" onclick="showPanel('resumen',this)">Resumen</button>
  <button class="tab-btn" onclick="showPanel('cadencia',this)">Cadencia</button>
  <button class="tab-btn" onclick="showPanel('ciaboga',this)">Ciaboga</button>
  <button class="tab-btn" onclick="showPanel('remeros',this)">Remeros</button>
  <button class="tab-btn" onclick="showPanel('mejoras',this)">Plan</button>
  <button class="tab-btn" onclick="showPanel('historico',this)">Histórico</button>
</nav>

<div id="panel-resumen"  class="panel active"></div>
<div id="panel-cadencia" class="panel"></div>
<div id="panel-ciaboga"  class="panel"></div>
<div id="panel-remeros"  class="panel"></div>
<div id="panel-mejoras"  class="panel"></div>
<div id="panel-historico" class="panel"></div>

</div><!-- /app -->

function buildLineChart(r) {
  const phases = r.fases.filter(f=>f.cad);
  const n = phases.length;
  const W=700,H=200,pL=58,pR=22,pT=20,pB=30;
  const pw=W-pL-pR, ph=H-pT-pB;
  const xs = phases.map((_,i)=>pL+i*pw/(n-1));
  const maxC=Math.max(...phases.map(f=>f.cad))+2;
  const minC=Math.min(...phases.map(f=>f.cad))-2;
  const yC = v => pT+ph-(v-minC)/(maxC-minC)*ph;
  const yT = v => pT+ph-v/35*ph;
  const yV = v => pT+ph-(v-5.5)/2.5*ph;

  // find ciaboga index
  const ciabIdx = r.fases.findIndex(f=>!f.cad);
  const preFases = r.fases.slice(0,ciabIdx).filter(f=>f.cad);
  const postFases = r.fases.slice(ciabIdx+1).filter(f=>f.cad);
  const allFases = r.fases;

  // x positions for all fases including ciaboga
  const allX = allFases.map((_,i)=>pL+i*pw/(allFases.length-1));
  const cadPts  = allFases.map((f,i)=>f.cad?`${allX[i]},${yC(f.cad)}`:null).filter(Boolean);
  const tumbPts = allFases.map((f,i)=>f.tumba?`${allX[i]},${yT(f.tumba)}`:null).filter(Boolean);
  const velPts  = allFases.map((f,i)=>f.vel?`${allX[i]},${yV(f.vel)}`:null).filter(Boolean);

  // split at ciaboga
  const preCad  = allFases.slice(0,ciabIdx).filter(f=>f.cad).map((f,_,a)=>{const i=allFases.indexOf(f);return `${allX[i]},${yC(f.cad)}`;});
  const postCad = allFases.slice(ciabIdx+1).filter(f=>f.cad).map(f=>{const i=allFases.indexOf(f);return `${allX[i]},${yC(f.cad)}`;});
  const ciabX   = allX[ciabIdx];
  const prevCad = allFases[ciabIdx-1]; const nextCad = allFases[ciabIdx+1];

  let svg = `<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a6b8a" stop-opacity="0.12"/><stop offset="100%" stop-color="#1a6b8a" stop-opacity="0"/></linearGradient></defs>`;
  // grid
  svg += `<line x1="${pL}" y1="${pT}" x2="${W-pR}" y2="${pT}" stroke="#d0e4ec" stroke-width="0.5"/>`;
  svg += `<line x1="${pL}" y1="${pT+ph/2}" x2="${W-pR}" y2="${pT+ph/2}" stroke="#d0e4ec" stroke-width="0.5"/>`;
  svg += `<line x1="${pL}" y1="${pT+ph}" x2="${W-pR}" y2="${pT+ph}" stroke="#d0e4ec" stroke-width="0.8"/>`;
  // ciaboga zone
  svg += `<rect x="${allX[ciabIdx]-15}" y="${pT}" width="30" height="${ph}" fill="#7b52a8" opacity="0.07" rx="3"/>`;
  svg += `<text x="${allX[ciabIdx]}" y="${pT-4}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#7b52a8">CIABOGA</text>`;
  // phase labels
  allFases.forEach((f,i)=>{
    svg += `<text x="${allX[i]}" y="${H-pB+14}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="${f.cad?f.col:'#7b52a8'}">${f.t}</text>`;
    svg += `<text x="${allX[i]}" y="${H-pB+24}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#8aabb8">${f.nombre}</text>`;
  });
  // Y labels
  svg += `<text x="${pL-5}" y="${yC(maxC-2)+4}" text-anchor="end" font-family="'DM Mono',monospace" font-size="9" fill="#1a6b8a">${maxC-2}</text>`;
  svg += `<text x="${pL-5}" y="${yC(minC+2)+4}" text-anchor="end" font-family="'DM Mono',monospace" font-size="9" fill="#1a6b8a">${minC+2}</text>`;
  svg += `<text x="${W-pR+4}" y="${yT(35)+4}" font-family="'DM Mono',monospace" font-size="9" fill="#e8a020">35°</text>`;
  svg += `<text x="${W-pR+4}" y="${yT(0)+4}" font-family="'DM Mono',monospace" font-size="9" fill="#e8a020">0°</text>`;
  // cadencia lines
  if(preCad.length>1) svg += `<polyline points="${preCad.join(' ')}" fill="none" stroke="#1a6b8a" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(postCad.length>1) svg += `<polyline points="${postCad.join(' ')}" fill="none" stroke="#1a6b8a" stroke-width="2.5" stroke-linejoin="round"/>`;
  // ciaboga dashed bridge
  if(prevCad&&nextCad) svg += `<polyline points="${allX[ciabIdx-1]},${yC(prevCad.cad)} ${allX[ciabIdx]},${yC(23)} ${allX[ciabIdx+1]},${yC(nextCad.cad)}" fill="none" stroke="#7b52a8" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  // tumba line
  const tumbPre  = allFases.slice(0,ciabIdx).filter(f=>f.tumba).map(f=>`${allX[allFases.indexOf(f)]},${yT(f.tumba)}`);
  const tumbPost = allFases.slice(ciabIdx+1).filter(f=>f.tumba).map(f=>`${allX[allFases.indexOf(f)]},${yT(f.tumba)}`);
  if(tumbPre.length>1)  svg += `<polyline points="${tumbPre.join(' ')}" fill="none" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(tumbPost.length>1) svg += `<polyline points="${tumbPost.join(' ')}" fill="none" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>`;
  // vel line
  const velPre  = allFases.slice(0,ciabIdx).filter(f=>f.vel).map(f=>`${allX[allFases.indexOf(f)]},${yV(f.vel)}`);
  const velPost = allFases.slice(ciabIdx+1).filter(f=>f.vel).map(f=>`${allX[allFases.indexOf(f)]},${yV(f.vel)}`);
  if(velPre.length>1)  svg += `<polyline points="${velPre.join(' ')}" fill="none" stroke="#1d8a5e" stroke-width="2" stroke-dasharray="6 3" stroke-linejoin="round"/>`;
  if(velPost.length>1) svg += `<polyline points="${velPost.join(' ')}" fill="none" stroke="#1d8a5e" stroke-width="2" stroke-dasharray="6 3" stroke-linejoin="round"/>`;
  // dots + labels
  allFases.forEach((f,i)=>{
    if(f.cad){
      svg += `<circle cx="${allX[i]}" cy="${yC(f.cad)}" r="4.5" fill="${f.col}" stroke="white" stroke-width="1.5"/>`;
      svg += `<text x="${allX[i]}" y="${yC(f.cad)-8}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="10" fill="${f.col}" font-weight="600">${f.cad}</text>`;
    }
    if(f.tumba){
      svg += `<circle cx="${allX[i]}" cy="${yT(f.tumba)}" r="4" fill="#e8a020" stroke="white" stroke-width="1.5"/>`;
      svg += `<text x="${allX[i]+12}" y="${yT(f.tumba)+4}" font-family="'DM Mono',monospace" font-size="9" fill="#e8a020" font-weight="600">${f.tumba}°</text>`;
    }
    if(f.vel){
      svg += `<circle cx="${allX[i]}" cy="${yV(f.vel)}" r="3.5" fill="#1d8a5e" stroke="white" stroke-width="1.5"/>`;
    }
  });
  return svg;
}

function buildBarChart(r) {
  const phases = r.fases.filter(f=>f.cad);
  const n = phases.length;
  const W=680,H=200,pL=40,pB=50,pT=20;
  const ph=H-pT-pB;
  const groupW = Math.floor((W-pL-20)/n);
  const bw = Math.floor(groupW/3)-4;
  const maxC=Math.max(...phases.map(f=>f.cad));
  const maxT=35;
  const maxV=8;

  let svg = '';
  svg += `<line x1="${pL}" y1="${H-pB}" x2="${W-10}" y2="${H-pB}" stroke="#8aabb8" stroke-width="0.8"/>`;

  phases.forEach((f,i)=>{
    const gx = pL + i*groupW;
    const hC = (f.cad/maxC)*ph;
    const hT = (f.tumba/maxT)*ph;
    const hV = (f.vel/maxV)*ph;
    const x0=gx+4, x1=gx+bw+8, x2=gx+bw*2+12;

    svg += `<rect x="${x0}" y="${H-pB-hC}" width="${bw}" height="${hC}" rx="3" fill="${f.col}" opacity="0.9"/>`;
    svg += `<text x="${x0+bw/2}" y="${H-pB-hC-4}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="${f.col}" font-weight="600">${f.cad}</text>`;

    svg += `<rect x="${x1}" y="${H-pB-hT}" width="${bw}" height="${hT}" rx="3" fill="#e8a020" opacity="0.85"/>`;
    svg += `<text x="${x1+bw/2}" y="${H-pB-hT-4}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="#e8a020" font-weight="600">${f.tumba}°</text>`;

    svg += `<rect x="${x2}" y="${H-pB-hV}" width="${bw}" height="${hV}" rx="3" fill="#1d8a5e" opacity="0.7"/>`;
    svg += `<text x="${x2+bw/2}" y="${H-pB-hV-4}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="#1d8a5e" font-weight="600">${f.vel}</text>`;

    svg += `<text x="${gx+groupW/2-4}" y="${H-pB+13}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="${f.col}">${f.nombre}</text>`;
    svg += `<text x="${gx+groupW/2-4}" y="${H-pB+23}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#8aabb8">${f.t}</text>`;
  });
  return svg;
}

// ── HISTÓRICO ─────────────────────────────────────────
const METRICS_CFG = {
  difLider:      {label:'Diferencia con 1.º (s)', unit:'s', color:'#993C1D', lowerBetter:true},
  cadMedia:      {label:'Cadencia media',          unit:'',  color:'#1a6b8a', lowerBetter:false},
  ciabogaDur:    {label:'Ciaboga (s)',              unit:'s', color:'#7b52a8', lowerBetter:true},
  reaceleracion: {label:'Reaceleración (s)',         unit:'s', color:'#0f7a8a', lowerBetter:true},
  tumbaSprint:   {label:'Tumba sprint (°)',          unit:'°', color:'#e8a020', lowerBetter:false},
  velPalada:     {label:'Vel/palada (m)',             unit:'m', color:'#1d8a5e', lowerBetter:false},
};
let currentMetric = 'difLider';

function selectMetric(btn, metric) {
  currentMetric = metric;
  document.querySelectorAll('.msel').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildEvolChart(metric);
}

function buildEvolChart(metric) {
  const cfg = METRICS_CFG[metric];
  const vals = RACES.map(r=>r[metric]);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  const range = maxV-minV||1;
  const W=620,H=140,pL=50,pR=20,pT=22,pB=38;
  const pw=W-pL-pR, ph=H-pT-pB;
  const xPos = i => pL + (RACES.length>1 ? i*pw/(RACES.length-1) : pw/2);
  const yScale = v => pT+ph-((v-minV)/range)*ph;

  const points = RACES.map((r,i)=>`${xPos(i)},${yScale(r[metric])}`).join(' ');
  const area = `${xPos(0)},${H-pB} ${points} ${xPos(RACES.length-1)},${H-pB}`;

  const dots = RACES.map((r,i)=>{
    const prev = RACES[i-1];
    const imp = prev ? (cfg.lowerBetter ? r[metric]<prev[metric] : r[metric]>prev[metric]) : null;
    const dc = imp===null ? cfg.color : imp ? '#1d8a5e' : '#d85a30';
    return `<circle cx="${xPos(i)}" cy="${yScale(r[metric])}" r="5" fill="${dc}" stroke="white" stroke-width="1.5"/>
            <text x="${xPos(i)}" y="${yScale(r[metric])-9}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="10" fill="${dc}" font-weight="600">${r[metric]}${cfg.unit}</text>`;
  }).join('');

  const xlbls = RACES.map((r,i)=>`
    <text x="${xPos(i)}" y="${H-pB+14}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" fill="#8aabb8">Sem.${r.week}</text>
    <text x="${xPos(i)}" y="${H-pB+25}" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="8" fill="#b0c8d4">${r.nombre.split('Regata de ')[1]||r.nombre}</text>`).join('');

  let note = '';
  if(RACES.length>=2){
    const last=RACES[RACES.length-1][metric], prev=RACES[RACES.length-2][metric];
    const diff=last-prev, better=cfg.lowerBetter?diff<0:diff>0;
    note = `${diff>0?'↑':diff<0?'↓':'→'} ${diff>0?'+':''}${diff}${cfg.unit} vs semana anterior · ${better?'✅ mejora':'⚠️ a trabajar'}`;
  }

  document.getElementById('evol-chart').innerHTML = `
    <svg width="100%" viewBox="0 0 ${W} ${H+5}">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${cfg.color}" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="${cfg.color}" stop-opacity="0.01"/>
      </linearGradient></defs>
      <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${H-pB}" stroke="#d0e4ec" stroke-width="0.5"/>
      <line x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}" stroke="#d0e4ec" stroke-width="0.8"/>
      <polygon points="${area}" fill="url(#eg)"/>
      <polyline points="${points}" fill="none" stroke="${cfg.color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${xlbls}
      <text x="${pL-5}" y="${pT+5}" text-anchor="end" font-family="'DM Mono',monospace" font-size="9" fill="#8aabb8">${maxV}${cfg.unit}</text>
      <text x="${pL-5}" y="${H-pB+4}" text-anchor="end" font-family="'DM Mono',monospace" font-size="9" fill="#8aabb8">${minV}${cfg.unit}</text>
    </svg>`;
  document.getElementById('evol-note').textContent = note;
}

function renderHistorico() {
  // comp table
  if(RACES.length>=2){
    const r1=RACES[0],r2=RACES[1];
    const rows=[
      {label:'Posición',      v1:`${r1.pos}.º/${r1.total}`,     v2:`${r2.pos}.º/${r2.total}`,     better:r2.pos<=r1.pos},
      {label:'Tiempo oficial',v1:r1.tiempoOficial,              v2:r2.tiempoOficial,              better:null},
      {label:'Dif. con 1.º', v1:`${r1.difLider} s`,             v2:`${r2.difLider} s`,            better:r2.difLider<r1.difLider},
      {label:'Cadencia media',v1:`${r1.cadMedia} p/m`,          v2:`${r2.cadMedia} p/m`,          better:r2.cadMedia>=r1.cadMedia},
      {label:'Ciaboga',       v1:`${r1.ciabogaDur} s`,          v2:`${r2.ciabogaDur} s`,          better:r2.ciabogaDur<r1.ciabogaDur},
      {label:'Reaceleración', v1:`${r1.reaceleracion} s`,       v2:`${r2.reaceleracion} s`,       better:r2.reaceleracion<r1.reaceleracion},
      {label:'Tumba sprint',  v1:`${r1.tumbaSprint}°`,          v2:`${r2.tumbaSprint}°`,          better:r2.tumbaSprint>r1.tumbaSprint},
      {label:'Vel/palada',    v1:`${r1.velPalada} m`,           v2:`${r2.velPalada} m`,           better:r2.velPalada>=r1.velPalada},
    ];
    document.getElementById('comp-table-body').innerHTML = rows.map((row,i)=>`
      <tr style="border-bottom:1px solid var(--border);background:${i%2?'rgba(26,107,138,0.02)':'transparent'}">
        <td style="padding:8px 10px;color:var(--text2);font-size:12px">${row.label}</td>
        <td style="padding:8px 14px;text-align:center;font-family:'DM Mono',monospace;font-size:12px">${row.v1}</td>
        <td style="padding:8px 14px;text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:${row.better===null?'var(--text)':row.better?'#1d8a5e':'#d85a30'}">${row.v2}</td>
        <td style="padding:8px 10px;text-align:center;font-size:14px">${row.better===null?'—':row.better?'✅':'⚠️'}</td>
      </tr>`).join('');
  }

  // race list
  const posIcons={1:'🥇',2:'🥈',3:'🥉'};
  const posColors={1:'pos-1',2:'pos-2',3:'pos-3'};
  document.getElementById('hist-list').innerHTML = RACES.map((r,i)=>{
    const prev=RACES[i-1];
    const trend=!prev?'—':r.cadMedia>prev.cadMedia?'↑':r.cadMedia<prev.cadMedia?'↓':'→';
    const trendCol=trend==='↑'?'color:#1D8A5E':trend==='↓'?'color:#D85A30':'color:var(--text3)';
    return `<div class="week-row">
      <div class="week-num">Sem. ${r.week}</div>
      <div class="week-date">${r.nombre}</div>
      <div class="week-pos ${posColors[r.pos]||'pos-other'}">${posIcons[r.pos]||''} ${r.pos}.º/${r.total}</div>
      <div class="week-cadencia">${r.cadMedia} p/m</div>
      <div class="week-trend" style="${trendCol}">${trend}</div>
    </div>`;
  }).join('');

  // hitos
  const last=RACES[RACES.length-1];
  const HITOS=[
    {label:'Reaceleración post-ciaboga',objetivo:'≤15 s', val:`${last.reaceleracion} s`,ok:last.reaceleracion<=15},
    {label:'Tumba en sprint',           objetivo:'>20°',  val:`${last.tumbaSprint}°`,  ok:last.tumbaSprint>20},
    {label:'Cadencia media',            objetivo:'≥29 p/m',val:`${last.cadMedia} p/m`, ok:last.cadMedia>=29},
    {label:'Diferencia con 1.º',        objetivo:'<5 s',  val:`${last.difLider} s`,   ok:last.difLider<5},
    {label:'Vel/palada',                objetivo:'>7.2 m', val:`${last.velPalada} m`,  ok:last.velPalada>7.2},
  ];
  document.getElementById('hitos-list').innerHTML = HITOS.map(h=>`
    <div class="hito-row">
      <div class="hito-icon">${h.ok?'✅':'🎯'}</div>
      <div class="hito-label">${h.label}</div>
      <div class="hito-vals">
        <span class="${h.ok?'hito-ok':'hito-nog'}">${h.val}</span>
        <span style="color:var(--text3);font-size:10px">obj: ${h.objetivo}</span>
        <span class="hito-badge ${h.ok?'badge-ok':'badge-prog'}">${h.ok?'Conseguido':'En progreso'}</span>
      </div>
    </div>`).join('');

  buildEvolChart(currentMetric);
}

          <th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;font-weight:500">MÉTRICA</th>
          ${RACES.map(r=>`<th style="padding:8px 14px;text-align:center;font-weight:700;font-size:12px;color:var(--sea)">${r.nombre.substring(r.nombre.indexOf(' de ')+4)}<br><span style="font-weight:400;font-size:10px;color:var(--text3)">${r.date}</span></th>`).join('')}
          <th style="padding:8px 10px;text-align:center;font-size:11px;color:var(--text3);font-weight:500">Tendencia</th>
        </tr></thead>
        <tbody id="comp-table-body"></tbody>
      </table>
    </div>
  </div>
  <div class="card mb16">
    <div class="sec-lbl">Evolución semana a semana</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${Object.entries(METRICS_CFG).map(([k,v],i)=>`<button class="msel ${i===0?'active':''}" onclick="selectMetric(this,'${k}')">${v.label}</button>`).join('')}
    </div>
    <div class="chart-area" id="evol-chart" style="min-height:150px"></div>
    <p style="font-size:11px;color:var(--text3);margin-top:6px" id="evol-note"></p>
  </div>
  <div class="hist-card">
    <div class="sec-lbl">Registro de regatas</div>
    <div id="hist-list"></div>
  </div>
  <div class="card mt16">
    <div class="sec-lbl">Hitos · estado actual</div>
    <div id="hitos-list"></div>
  </div>`;

// ── INIT ──────────────────────────────────────────────
function showPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='remeros'){
    setTimeout(()=>{
      document.querySelectorAll('.score-fill').forEach(bar=>{
        const w=bar.dataset.w; bar.style.width='0%';
        requestAnimationFrame(()=>{bar.style.width=w+'%'});
      });
    },50);
  }
}

renderSelector();
renderAll();
renderHistorico();
</script>
</body>
</html>
